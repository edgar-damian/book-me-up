# HTTPS for book-me-up.com. setup-ec2.sh installs this only once the
# certificate exists, since nginx won't start without it. The domain is also
# set in setup-ec2.sh.

# Redirects the domain to HTTPS. The bare IP still falls through to book-me-up.conf.
server {
    listen 80;
    listen [::]:80;
    server_name book-me-up.com www.book-me-up.com;
    server_tokens off;

    # Renewals repeat the challenge over HTTP, so it is exempt from the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name book-me-up.com www.book-me-up.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/book-me-up.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/book-me-up.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include snippets/book-me-up-proxy.conf;
}
