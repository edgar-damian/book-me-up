# Plain-HTTP catch-all. Serves the IP address, and the domain until HTTPS is
# set up. Installed to /etc/nginx/conf.d/ by setup-ec2.sh.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # Let's Encrypt HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include snippets/book-me-up-proxy.conf;
}
