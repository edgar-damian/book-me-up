[project]
name = "server"
version = "0.1.0"
description = "book-me-up API — booking backend for chair-based service workers"
readme = "README.md"
authors = [
    { name = "Edgar Rios Negrete", email = "edgariosnegrete@icloud.com" }
]
requires-python = ">=3.12.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "supabase>=2.34.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
markers = ["live: hits the real Supabase project"]

[tool.ruff]
line-length = 100
src = ["src"]
# Regenerated by scripts/gen_models.py — linting it is noise, and any fix is
# overwritten on the next run.
extend-exclude = ["src/server/models/supabase_models.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, import sorting
