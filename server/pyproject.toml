[project]
name = "server"
version = "0.1.0"
description = "book-me-up API — booking backend for chair-based service workers"
readme = "README.md"
authors = [
    { name = "Edgar Rios Negrete", email = "edgariosnegrete@icloud.com" }
]
requires-python = ">=3.12.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "supabase>=2.31.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "sqlacodegen>=4.0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
markers = ["live: hits the real Supabase project"]

[tool.ruff]
line-length = 100
src = ["src"]
# Regenerated by scripts/gen_models.py — linting it is noise, and any fix is
# overwritten on the next run.
extend-exclude = ["src/server/models/supabase_models.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, import sorting
